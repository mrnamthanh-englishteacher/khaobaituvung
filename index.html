<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG READING UNIT 4 ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
 {
    q: "Uncontrolled urban expansion may ______ nearby forests and farmland as developers gradually build beyond the city's existing boundaries.",
    a: ["encroach upon", "engage with", "derive from", "blend in with"],
    c: 0
  },
  {
    q: "The sudden closure of the region's largest factory could ______ serious economic difficulties for thousands of local families.",
    a: ["mitigate", "bring about", "overlook", "eradicate"],
    c: 1
  },
  {
    q: "Many highly educated young people move abroad in search of better ______, including more attractive career opportunities and higher salaries.",
    a: ["consumption patterns", "preventive measures", "job prospects", "social exclusions"],
    c: 2
  },
  {
    q: "When a country permanently loses large numbers of highly skilled professionals to employment opportunities abroad, it may experience ______.",
    a: ["displacement", "social exclusion", "engagement", "brain drain"],
    c: 3
  },
  {
    q: "Rapid economic development should not come at the ______ of environmental protection and public health.",
    a: ["expense", "proximity", "engagement", "implementation"],
    c: 0
  },
  {
    q: "Plastic waste can seriously ______ marine ecosystems by damaging habitats and interfering with food chains.",
    a: ["sustain", "disrupt", "accommodate", "regulate"],
    c: 1
  },
  {
    q: "Small family-owned shops often struggle to ______ multinational retailers that can offer much lower prices.",
    a: ["assimilate", "advocate", "compete with", "accumulate"],
    c: 2
  },
  {
    q: "Agriculture remains the ______ of the local economy, providing the main source of employment and income for most residents.",
    a: ["anomaly", "intervention", "displacement", "backbone"],
    c: 3
  },
  {
    q: "By repeatedly warning that immediate action is essential, the latest climate report clearly ______ the urgent need to reduce greenhouse gas emissions.",
    a: ["underscores", "overlooks", "diminishes", "disrupts"],
    c: 0
  },
  {
    q: "Policymakers sometimes face a difficult ______: stricter environmental regulations may protect nature but increase short-term costs for businesses.",
    a: ["initiative", "trade-off", "anomaly", "proximity"],
    c: 1
  },
  {
    q: "Poorly planned urban development may ______ existing social inequalities, making the gap between wealthy and disadvantaged residents even wider.",
    a: ["alleviate", "eradicate", "exacerbate", "sustain"],
    c: 2
  },
  {
    q: "Restoring wetlands can help ______ the effects of flooding because wetlands absorb and temporarily store excess rainwater.",
    a: ["generate", "trigger", "accelerate", "mitigate"],
    c: 3
  },
  {
    q: "If toxic chemicals continue to enter the river, they may ______ a serious threat to both human health and aquatic life.",
    a: ["pose", "derive", "undertake", "integrate"],
    c: 0
  },
  {
    q: "Environmental organizations often ______ stricter wildlife-protection laws, publicly arguing that stronger regulations are necessary.",
    a: ["accommodate", "advocate", "fluctuate", "assimilate"],
    c: 1
  },
  {
    q: "Despite repeated requests from residents, the needs of disadvantaged communities were completely ______ by planners, who gave them no consideration.",
    a: ["integrated", "regulated", "overlooked", "generated"],
    c: 2
  },
  {
    q: "A policy that distributes resources fairly and ensures that disadvantaged groups receive appropriate support can be described as ______.",
    a: ["conventional", "undesirable", "systemic", "equitable"],
    c: 3
  },
  {
    q: "If social isolation is allowed to persist for years without intervention, it may gradually ______ and become deeply established within a community.",
    a: ["take root", "sleep rough", "deal a blow", "come at a cost"],
    c: 0
  },
  {
    q: "Although thousands of people live in close physical ______ to one another in large apartment buildings, many rarely interact with their neighbours.",
    a: ["resilience", "proximity", "prosperity", "displacement"],
    c: 1
  },
  {
    q: "When online communication completely replaces meaningful face-to-face interaction, it may unintentionally ______ feelings of loneliness that were not previously present.",
    a: ["eradicate", "diminish", "engender", "alleviate"],
    c: 2
  },
  {
    q: "Temporary workers without guaranteed hours, stable income, or long-term contracts often find themselves in ______ employment.",
    a: ["adaptive", "forward-looking", "integrated", "precarious"],
    c: 3
  },
  {
    q: "Despite living among millions of people, some urban residents find that meaningful and lasting social connections remain ______ and difficult to establish.",
    a: ["elusive", "equitable", "conventional", "off-peak"],
    c: 0
  },
  {
    q: "After years of treating loneliness as merely a private matter, governments increasingly ______ it as a serious public-health concern.",
    a: ["generate", "acknowledge", "accelerate", "regulate"],
    c: 1
  },
  {
    q: "Some researchers ______ chronic loneliness with major health risks such as smoking, arguing that their long-term effects can be comparable in severity.",
    a: ["separate", "contrast", "equate", "protect"],
    c: 2
  },
  {
    q: "Long-term exposure to severe air pollution can increase the risk of ______ mortality, causing some people to die earlier than normally expected.",
    a: ["profound", "systemic", "transient", "premature"],
    c: 3
  },
  {
    q: "Tackling urban loneliness effectively will ______ substantial investment in public spaces, community programmes, and social services.",
    a: ["call for", "compete with", "derive from", "blend in with"],
    c: 0
  },
  {
    q: "Adding more parks, libraries, and community centres can ______ opportunities for face-to-face interaction by increasing the number of places where residents can meet.",
    a: ["eradicate", "augment", "overlook", "fluctuate"],
    c: 1
  },
  {
    q: "Researchers found that many of the area's social problems ______ long-term poverty and unequal access to education, rather than recent technological changes.",
    a: ["generate", "undertake", "stem from", "integrate"],
    c: 2
  },
  {
    q: "The city launched a new housing ______ specifically designed to provide homeless teenagers with accommodation and counselling.",
    a: ["anomaly", "backbone", "erosion", "initiative"],
    c: 3
  },
  {
    q: "Smartphones and online services are now ______ linked to modern daily life, making it extremely difficult to separate digital technology from work, education, and communication.",
    a: ["inextricably", "holistically", "conventionally", "transiently"],
    c: 0
  },
  {
    q: "The new platform can ______ information from several databases into its system so that the data can be processed together.",
    a: ["eradicate", "assimilate", "diminish", "advocate"],
    c: 1
  },
  {
    q: "The researchers had difficulty combining the results because the data came from ______ sources that differed considerably in format, methodology, and purpose.",
    a: ["adaptive", "integrated", "disparate", "equitable"],
    c: 2
  },
  {
    q: "Electricity prices may ______ considerably from month to month, rising when demand is high and falling when demand decreases.",
    a: ["sustain", "accelerate", "eradicate", "fluctuate"],
    c: 3
  },
  {
    q: "Without treatment, the patient's condition may gradually ______, becoming more severe and increasingly difficult to manage.",
    a: ["deteriorate", "accommodate", "engage", "accumulate"],
    c: 0
  },
  {
    q: "Vaccination programmes, health screenings, and public-awareness campaigns are examples of ______ intended to stop illnesses before they become more serious.",
    a: ["consumption patterns", "preventive measures", "job prospects", "standards of living"],
    c: 1
  },
  {
    q: "Unlike systems that operate in exactly the same way under all circumstances, ______ technologies can adjust their behaviour in response to changing conditions.",
    a: ["profound", "conventional", "adaptive", "overriding"],
    c: 2
  },
  {
    q: "Fast fashion gives consumers access to inexpensive clothing, but this convenience can ______, as producing and discarding huge quantities of clothes causes serious environmental damage.",
    a: ["take root", "engage with others", "blend in with society", "come at a cost"],
    c: 3
  },
  {
    q: "The new law aims to ______ a dangerous disease completely rather than merely reduce the number of cases.",
    a: ["eradicate", "sustain", "accumulate", "accommodate"],
    c: 0
  },
  {
    q: "Homeless teenagers sometimes try to ______ their classmates by dressing and behaving similarly so that their difficult living situation remains unnoticed.",
    a: ["compete with", "blend in with", "pose a threat to", "stem from"],
    c: 1
  },
  {
    q: "Severe financial ______ may prevent low-income families from paying rent or obtaining safe and stable housing.",
    a: ["prosperity", "engagement", "hardship", "resilience"],
    c: 2
  },
  {
    q: "Access to stable housing, education, and supportive relationships can help vulnerable young people develop ______, enabling them to recover from difficult experiences and adapt to future challenges.",
    a: ["inequality", "displacement", "intervention", "resilience"],
    c: 3
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
