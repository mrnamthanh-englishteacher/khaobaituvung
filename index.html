<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG  ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
{
    q: "The government hopes that lower taxes will ______ economic growth and encourage businesses to invest more money.",
    a: ["diagnose", "displace", "boost", "prescribe"],
    c: 2
  },
  {
    q: "The hotel was comfortable, ______ a little expensive for students travelling on a limited budget.",
    a: ["regardless", "albeit", "whose", "despite"],
    c: 1
  },
  {
    q: "The scientist noticed an unusual result that was very different from all the other measurements. He decided to investigate this ______.",
    a: ["accommodation", "implementation", "prescription", "anomaly"],
    c: 3
  },
  {
    q: "The teacher spoke to a student ______ parents had recently moved to another city.",
    a: ["whose", "whom", "which", "where"],
    c: 0
  },
  {
    q: "The school bought ten new computers, all of ______ were installed in the computer room.",
    a: ["whom", "whose", "which", "where"],
    c: 2
  },
  {
    q: "The hospital uses an ______ computer system that connects patient records from different departments.",
    a: ["integrated", "mortal", "intimate", "elusive"],
    c: 0
  },
  {
    q: "After several months of hard work, the company finally reported significant financial ______.",
    a: ["prescriptions", "gains", "anomalies", "constraints"],
    c: 1
  },
  {
    q: "The army decided to ______ more soldiers to the flooded area to help rescue local residents.",
    a: ["curate", "diagnose", "diminish", "deploy"],
    c: 3
  },
  {
    q: "Constant criticism from parents can sometimes ______ feelings of anxiety and insecurity in young children.",
    a: ["compensate", "optimize", "engender", "alleviate"],
    c: 2
  },
  {
    q: "You should avoid running with an injured knee because it may ______ the injury and make the pain worse.",
    a: ["aggravate", "integrate", "accumulate", "augment"],
    c: 0
  },
  {
    q: "The school hired five additional teachers to ______ its teaching staff before the new school year began.",
    a: ["displace", "fluctuate", "originate", "augment"],
    c: 3
  },
  {
    q: "The company plans to open more stores next year. This ______ will create hundreds of new jobs.",
    a: ["detachment", "expansion", "proximity", "prescription"],
    c: 1
  },
  {
    q: "Many students experienced stress ______ the pressure to achieve high examination scores.",
    a: ["appointed to", "engaged in", "stemming from", "compensated for"],
    c: 2
  },
  {
    q: "The museum displays traditional clothes ______ different regions of Vietnam.",
    a: ["originating from", "engaging in", "fluctuating with", "compensating for"],
    c: 0
  },
  {
    q: "Her success is ______ years of hard work, patience and strong determination.",
    a: ["engaged in", "traced back to", "compensated for", "rooted in"],
    c: 3
  },
  {
    q: "The ancient temple can ______ the fifteenth century, when it was first built by local villagers.",
    a: ["engage in", "be traced back to", "compensate for", "fluctuate with"],
    c: 1
  },
  {
    q: "The company bought faster machines to ______ production and finish customer orders more quickly.",
    a: ["aggravate", "displace", "accelerate", "diagnose"],
    c: 2
  },
  {
    q: "The school offers three main subjects, ______, Mathematics, English and Science.",
    a: ["i.e.", "albeit", "whose", "regardless of"],
    c: 0
  },
  {
    q: "As the storm moved closer to the coast, the strong winds began to ______, making it dangerous for people to go outside.",
    a: ["diminish", "compensate", "curate", "intensify"],
    c: 3
  },
  {
    q: "The patient was taken to hospital immediately because he was suffering from ______ chest pain and had difficulty breathing.",
    a: ["intimate", "acute", "ethical", "optimal"],
    c: 1
  },
  {
    q: "The changes in her voice were so ______ that most people did not notice them.",
    a: ["mortal", "spontaneous", "subtle", "prominent"],
    c: 2
  },
  {
    q: "The loud explosion ______ panic among the people nearby, causing many of them to run away.",
    a: ["triggered", "curated", "optimized", "compensated"],
    c: 0
  },
  {
    q: "The school organised a sports competition to ______ students to exercise more regularly.",
    a: ["diminish", "displace", "aggravate", "encourage"],
    c: 3
  },
  {
    q: "The fire did not ______ in the kitchen. Investigators discovered that it had started in the storage room.",
    a: ["integrate", "originate", "compensate", "fluctuate"],
    c: 1
  },
  {
    q: "The teacher asked students to ______ the best photograph from a collection of twenty pictures for the school exhibition.",
    a: ["escalate", "prescribe", "carefully select", "displace"],
    c: 2
  },
  {
    q: "All students are welcome to join the English club, ______ their age or English level.",
    a: ["regardless of", "derived from", "stemming from", "engaged in"],
    c: 0
  },
  {
    q: "He studies English for thirty minutes every day and follows the same routine. He has been remarkably ______ in his learning.",
    a: ["superficial", "spontaneous", "paradoxical", "consistent"],
    c: 3
  },
  {
    q: "Reading and listening are ______ skills. Practising both can help students understand English better.",
    a: ["mortal", "complementary", "elusive", "acute"],
    c: 1
  },
  {
    q: "Eating too much sugary food can ______ existing dental problems and cause further damage to your teeth.",
    a: ["alleviate", "compensate for", "worsen", "optimize"],
    c: 2
  },
  {
    q: "After practising English every day for six months, she made impressive ______ in her speaking ability.",
    a: ["gains", "anomalies", "proximity", "detachment"],
    c: 0
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
