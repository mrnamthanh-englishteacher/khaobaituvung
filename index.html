<html lang="vi">
<head>

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG UNIT 3 ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
  {
    q: "Over time, food waste begins to ______ naturally and turns into simpler substances.",
    a: ["decompose", "solidify", "compress", "circulate"],
    c: 0
  },
  {
    q: "The new packaging is ______ three layers of recycled material.",
    a: ["proportional to", "composed of", "contaminated with", "reluctant to"],
    c: 1
  },
  {
    q: "Sugar will ______ completely when it is stirred into hot water.",
    a: ["decay", "melt", "dissolve", "accumulate"],
    c: 2
  },
  {
    q: "When liquid water is heated sufficiently, it begins to ______ into the air.",
    a: ["solidify", "extract", "absorb", "evaporate"],
    c: 3
  },
  {
    q: "Please do not ______ these documents because we may need them again next week.",
    a: ["discard", "retain", "store", "maintain"],
    c: 0
  },
  {
    q: "The warehouse is full, so we need to ______ some of the old equipment that is no longer used.",
    a: ["accumulate", "get rid of", "absorb", "extract"],
    c: 1
  },
  {
    q: "All of the extra chairs are currently ______ until the new office opens.",
    a: ["intact", "proportional", "in storage", "single-use"],
    c: 2
  },
  {
    q: "A ______ of the company's budget is spent on employee training.",
    a: ["balanced diet", "public outrage", "rapid expansion", "significant portion"],
    c: 3
  },
  {
    q: "The amount of electricity used is directly ______ to the number of machines operating.",
    a: ["proportional", "sustainable", "sufficient", "feasible"],
    c: 0
  },
  {
    q: "The restaurant uses ______ vegetables from yesterday to make soup instead of throwing them away.",
    a: ["reusable", "leftover", "disposable", "imaginary"],
    c: 1
  },
  {
    q: "Flour is the main ______ in this type of bread.",
    a: ["contaminant", "fertilizer", "ingredient", "pollutant"],
    c: 2
  },
  {
    q: "The factory's decision to discharge untreated chemical waste into the river was considered completely ______.",
    a: ["commendable", "tolerable", "justifiable", "unacceptable"],
    c: 3
  },
  {
    q: "I ______ my coworker's black bag for mine because they looked almost identical.",
    a: ["mistook", "abandoned", "retained", "displayed"],
    c: 0
  },
  {
    q: "The manufacturer recalled the product after discovering a serious ______ in its electrical system.",
    a: ["mistake", "defect", "contribution", "allocation"],
    c: 1
  },
  {
    q: "The drinking water became ______ after harmful chemicals leaked from a nearby factory.",
    a: ["purified", "reusable", "contaminated", "sustainable"],
    c: 2
  },
  {
    q: "Before using the bottle again, ______ it out thoroughly with clean water.",
    a: ["soak", "scrub", "wipe", "rinse"],
    c: 3
  },
  {
    q: "Unlike single-use cups, these containers are ______ and can be washed and used many times.",
    a: ["reusable", "disposable", "non-recyclable", "hazardous"],
    c: 0
  },
  {
    q: "Used batteries should be treated as ______ because they may contain dangerous chemicals.",
    a: ["natural resources", "hazardous waste", "public transport", "biological diversity"],
    c: 1
  },
  {
    q: "The hotel has replaced single-use plastic bottles with more ______ alternatives.",
    a: ["objectionable", "imaginary", "eco-friendly", "proportionate"],
    c: 2
  },
  {
    q: "The campaign was designed to ______ awareness of the environmental damage caused by plastic waste.",
    a: ["rise", "lift", "produce", "raise"],
    c: 3
  },
  {
    q: "Using public transport instead of driving can help people reduce their carbon ______.",
    a: ["footprint", "component", "coverage", "operation"],
    c: 0
  },
  {
    q: "Coal, oil, and natural gas are all types of ______ that release greenhouse gases when burned.",
    a: ["natural resources", "fossil fuels", "organic fertilizers", "harmful chemicals"],
    c: 1
  },
  {
    q: "Some industries ______ forests and other natural resources faster than they can recover.",
    a: ["circulate", "sterilize", "overexploit", "solidify"],
    c: 2
  },
  {
    q: "Trees help protect the environment because they ______ carbon dioxide from the atmosphere.",
    a: ["discharge", "emit", "release", "absorb"],
    c: 3
  },
  {
    q: "The company plans to ______ more workers to deal with the rapid expansion of its business.",
    a: ["recruit", "dismiss", "withdraw", "abandon"],
    c: 0
  },
  {
    q: "The company decided to ______ the product launch until additional safety tests were completed.",
    a: ["hesitate", "postpone", "rush out", "pioneer"],
    c: 1
  },
  {
    q: "The company's new electric vehicle is expected to ______ early next year, when it becomes available for purchase.",
    a: ["follow traditions", "cause obstacles", "hit the market", "withdraw"],
    c: 2
  },
  {
    q: "Although the new recycling system is expensive initially, it should save the company money ______.",
    a: ["for good", "temporarily", "for the time being", "in the long run"],
    c: 3
  },
  {
    q: "The environmental team conducted a comprehensive ______ of the damage before recommending solutions.",
    a: ["assessment", "distribution", "donation", "operation"],
    c: 0
  },
  {
    q: "The coastal ecosystem has suffered severe ______ because of pollution and uncontrolled development.",
    a: ["expansion", "degradation", "contribution", "allocation"],
    c: 1
  },
  {
    q: "Thousands of visitors gathered to watch the ______ firework display during the festival.",
    a: ["disputable", "imaginary", "spectacular", "intolerable"],
    c: 2
  },
  {
    q: "Scientists use computer models to ______ how climate change may affect wildlife populations in the future.",
    a: ["operate", "maintain", "contribute", "predict"],
    c: 3
  },
  {
    q: "Protecting biological ______ is essential because healthy ecosystems depend on many different species.",
    a: ["diversity", "uniformity", "similarity", "distribution"],
    c: 0
  },
  {
    q: "Oil began to ______ from a small hole in the damaged pipe and contaminate the surrounding soil.",
    a: ["pour", "leak", "extract", "compress"],
    c: 1
  },
  {
    q: "All employees are encouraged to make a ______ to the company's environmental programme by suggesting new ideas.",
    a: ["donation", "distribution", "contribution", "transition"],
    c: 2
  },
  {
    q: "Vegetable peels and other organic waste can be placed in a ______ to produce natural fertilizer.",
    a: ["landfill", "storage room", "packaging box", "composting bin"],
    c: 3
  },
  {
    q: "Getting sufficient sleep and eating a balanced diet can help ______ infection and keep the body healthy.",
    a: ["ward off", "use up", "clear up", "look into"],
    c: 0
  },
  {
    q: "The government plans to ______ a strict policy to reduce the amount of chemical waste discharged by factories.",
    a: ["carry on", "implement", "turn out", "work out"],
    c: 1
  },
  {
    q: "Environmental officials are ______ a possible chemical leak at one of the factories.",
    a: ["carrying on", "using up", "looking into", "putting into practice"],
    c: 2
  },
  {
    q: "All factories must ______ environmental legislation when discharging waste into rivers.",
    a: ["carry on", "take on", "be willing to", "comply with"],
    c: 3
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){clearInterval(timer);submitQuiz();}
},1000);

// submit
function submitQuiz(){
  let name=document.getElementById("username").value.trim();
  if(!name){alert("Nhập tên!");return;}
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br><br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
