<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG  ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
 {
    q: "Despite receiving numerous complaints about unsafe working conditions, the company's management failed to ______ stricter safety regulations until a serious accident occurred.",
    a: ["accumulate", "implement", "diagnose", "originate"],
    c: 1
  },
  {
    q: "The investigation revealed that the conflict had ______ considerably over the previous six months, with minor disagreements developing into violent confrontations.",
    a: ["diminished", "fluctuated", "alleviated", "intensified"],
    c: 3
  },
  {
    q: "The sudden collapse of the banking system caused public confidence to ______ sharply, leaving many investors unwilling to deposit their savings.",
    a: ["diminish", "accumulate", "engender", "augment"],
    c: 0
  },
  {
    q: "The coastal region is ______ diverse marine life, including several endangered species that cannot be found anywhere else in the world.",
    a: ["rooted in", "engaged in", "teeming with", "derived from"],
    c: 2
  },
  {
    q: "Having grown tired of the constant ______ of city life, the couple moved to a remote village where they could enjoy peace and quiet.",
    a: ["proximity", "hustle and bustle", "implementation", "emergence"],
    c: 1
  },
  {
    q: "The charity encourages university students to ______ voluntary activities that provide educational support for disadvantaged children.",
    a: ["engage in", "originate from", "compensate for", "fluctuate with"],
    c: 0
  },
  {
    q: "The new digital platform allows hospitals to ______ patients' medical records from different departments into a single, accessible database.",
    a: ["displace", "prescribe", "aggravate", "integrate"],
    c: 3
  },
  {
    q: "The government's announcement of unexpectedly severe restrictions ______ widespread concern among small business owners who feared losing their livelihoods.",
    a: ["compensated", "curated", "engendered", "diminished"],
    c: 2
  },
  {
    q: "______ , the introduction of advanced communication technologies has left some individuals feeling more socially isolated despite being constantly connected online.",
    a: ["Consistently", "Paradoxically", "Spontaneously", "Superficially"],
    c: 1
  },
  {
    q: "The company's financial report provided only a ______ explanation of its declining profits, failing to examine the underlying causes or offer supporting evidence.",
    a: ["superficial", "sophisticated", "complementary", "optimal"],
    c: 0
  },
  {
    q: "Although the doctor initially suspected a common respiratory infection, further laboratory tests were necessary to ______ the patient's rare autoimmune disorder accurately.",
    a: ["appoint", "prescribe", "deploy", "diagnose"],
    c: 3
  },
  {
    q: "After reviewing the patient's medical history, the physician issued a ______ specifying the exact dosage and duration of the required medication.",
    a: ["diagnosis", "prescription", "compensation", "implementation"],
    c: 1
  },
  {
    q: "The manager expressed concern about the team's ______ of technical expertise, particularly its inability to operate recently installed manufacturing equipment.",
    a: ["gains", "proximity", "lack", "consistency"],
    c: 2
  },
  {
    q: "The researchers observed an ______ increase in temperature within the experimental chamber, even though all heating equipment had been switched off.",
    a: ["anomalous", "optimal", "intimate", "ethical"],
    c: 0
  },
  {
    q: "Rather than relying on outdated procedures, the company introduced a series of automated systems to ______ energy consumption and minimise unnecessary waste.",
    a: ["intensify", "displace", "accumulate", "optimize"],
    c: 3
  },
  {
    q: "Following a detailed evaluation of all available treatment methods, the medical team selected the ______ approach, balancing effectiveness, patient safety, and recovery time.",
    a: ["spontaneous", "optimal", "mortal", "superficial"],
    c: 1
  },
  {
    q: "The university invited an ______ physicist, internationally recognised for her pioneering research in quantum mechanics, to deliver the opening lecture.",
    a: ["elusive", "integrated", "eminent", "acute"],
    c: 2
  },
  {
    q: "The international conference attracted several ______ environmental activists whose campaigns had significantly influenced climate policy around the world.",
    a: ["prominent", "mortal", "complicated", "complementary"],
    c: 0
  },
  {
    q: "Because the children's performance had not been rehearsed or planned in advance, their cheerful dancing was entirely ______.",
    a: ["consistent", "intensified", "integrated", "spontaneous"],
    c: 3
  },
  {
    q: "The accountant discovered that several employees had been using a ______ system of overlapping spreadsheets, making even simple financial calculations unnecessarily difficult.",
    a: ["optimal", "complicated", "intimate", "complementary"],
    c: 1
  },
  {
    q: "The programme was designed to help farmers ______ sufficient financial reserves during profitable seasons so that they could survive periods of drought.",
    a: ["fluctuate", "diminish", "accumulate", "displace"],
    c: 2
  },
  {
    q: "The new research facility provides temporary ______ for scientists visiting from overseas, including furnished apartments located within walking distance of the laboratories.",
    a: ["accommodation", "prescription", "compensation", "detachment"],
    c: 0
  },
  {
    q: "The rapid expansion of the ______ has allowed many workers to earn money through short-term freelance contracts rather than traditional permanent employment.",
    a: ["proximity", "gig economy", "hustle and bustle", "implementation"],
    c: 1
  },
  {
    q: "The psychologist suggested that the patient's emotional ______ from close friends and family had developed gradually after years of working alone in a foreign country.",
    a: ["emergence", "augmentation", "proximity", "detachment"],
    c: 3
  },
  {
    q: "The two researchers developed an unusually ______ working relationship, sharing personal experiences and discussing sensitive matters that they rarely revealed to other colleagues.",
    a: ["mortal", "superficial", "intimate", "elusive"],
    c: 2
  },
  {
    q: "The scientist refused to conduct experiments on human participants without their informed consent, arguing that such research would violate fundamental ______ principles.",
    a: ["ethical", "mortal", "spontaneous", "complementary"],
    c: 0
  },
  {
    q: "According to the ancient legend, the warriors were ordinary ______ beings who could be injured or killed, despite their extraordinary physical strength.",
    a: ["eminent", "optimal", "consistent", "mortal"],
    c: 3
  },
  {
    q: "Many traditional Vietnamese festivals ______ ancient agricultural rituals that were practised long before the development of modern religious institutions.",
    a: ["compensate for", "stem from", "engage in", "fluctuate with"],
    c: 1
  },
  {
    q: "The researchers examined a medicinal substance ______ the roots of a rare tropical plant, rather than synthesised entirely from artificial chemicals.",
    a: ["engaged in", "compensated for", "derived from", "appointed to"],
    c: 2
  },
  {
    q: "The university's scholarship committee evaluates applicants solely on academic merit and demonstrated financial need, ______ their nationality or family background.",
    a: ["irrespective of", "originating from", "engaged in", "stemming from"],
    c: 0
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
