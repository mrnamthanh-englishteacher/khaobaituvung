<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG  ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
   {
    q: "Thousands of high school graduates ______ scholarships to study at prestigious universities abroad every year.",
    a: ["apply for", "qualify in", "engage to", "specify for"],
    c: 0
  },
  {
    q: "The new safety regulations are ______ all employees working in the laboratory, regardless of their positions.",
    a: ["application to", "applicant for", "applicable to", "appliance for"],
    c: 2
  },
  {
    q: "The professional athlete was immediately ______ from the international competition after officials discovered that he had violated the anti-doping regulations.",
    a: ["qualified", "disqualified", "exemplified", "specified"],
    c: 1
  },
  {
    q: "The technology company is looking for highly ______ engineers who have extensive experience in developing artificial intelligence systems.",
    a: ["qualification", "qualify", "quality", "qualified"],
    c: 3
  },
  {
    q: "To achieve better academic results, students should make an effort ______ their time-management and communication skills.",
    a: ["improving", "improve", "to improve", "improved"],
    c: 2
  },
  {
    q: "The volunteers put considerable effort ______ organising a charity event to raise money for disadvantaged children in remote areas.",
    a: ["into", "for", "with", "to"],
    c: 0
  },
  {
    q: "During the science lesson, the teacher encouraged students to engage ______ group discussions about the advantages and disadvantages of artificial intelligence.",
    a: ["to", "with", "for", "in"],
    c: 3
  },
  {
    q: "Teachers should regularly engage ______ their students through classroom conversations to better understand their learning difficulties and personal needs.",
    a: ["in", "with", "to", "from"],
    c: 1
  },
  {
    q: "Under the ______ of experienced teachers, students gradually developed the necessary skills to conduct independent scientific research.",
    a: ["guide", "guiding", "guidance", "guided"],
    c: 2
  },
  {
    q: "Educational experts believe that every child should be given equal opportunities to develop their abilities and realise their full ______.",
    a: ["potential", "personnel", "qualification", "specification"],
    c: 0
  },
  {
    q: "Artificial intelligence has the potential ______ the way people work by automating repetitive tasks and improving productivity.",
    a: ["changing", "change", "changed", "to change"],
    c: 3
  },
  {
    q: "The multinational corporation hired an experienced financial ______ to examine its annual reports and identify potential investment risks.",
    a: ["analysis", "analyst", "analyse", "analytical"],
    c: 1
  },
  {
    q: "Before introducing the new education policy, the researchers decided to perform a detailed ______ of students' learning habits and academic performance.",
    a: ["analyst", "analyse", "analysis", "analytical"],
    c: 2
  },
  {
    q: "Online learning platforms are particularly ______ to students living in remote areas because they provide access to educational resources without requiring long-distance travel.",
    a: ["beneficial", "beneficiary", "benefactor", "benefit"],
    c: 0
  },
  {
    q: "The success of the community project is a clear ______ of how effective teamwork can help solve serious environmental problems.",
    a: ["exemplary", "exemplify", "exemplification", "exemplified"],
    c: 2
  },
  {
    q: "A good leader should lead ______ by demonstrating responsibility, honesty and dedication rather than simply telling employees what to do.",
    a: ["in quality", "by example", "under guidance", "with potential"],
    c: 1
  },
  {
    q: "When reporting problems with the new computer system, employees are expected to be ______ about the errors they have encountered so that technicians can identify and fix them quickly.",
    a: ["specification", "specify", "specifically", "specific"],
    c: 3
  },
  {
    q: "To make the university admission process more convenient, the government has introduced an online ______ system that allows students to submit their documents electronically.",
    a: ["application", "applicant", "appliance", "applicable"],
    c: 0
  },
  {
    q: "Although the teacher's comments were intended to help her improve, the student took them ______ and felt that she was being unfairly criticised.",
    a: ["personally", "specifically", "effortlessly", "beneficially"],
    c: 0
  },
  {
    q: "The science museum organised an ______ workshop in which students could interact with robots, experiment with new technologies and learn about artificial intelligence.",
    a: ["engaged", "engaging", "engagement", "engage"],
    c: 1
  },
  {
    q: "Before purchasing a new gaming laptop, customers should carefully examine its technical ______, including the processor, memory capacity and graphics card.",
    a: ["qualifications", "applications", "specifications", "exemplifications"],
    c: 2
  },
  {
    q: "After dating for five years, the couple finally decided to get ______ to each other and announced their wedding plans to their families.",
    a: ["engaged", "engaging", "engagement", "engage"],
    c: 0
  },
  {
    q: "After several months of training, the young athlete finally ______ for the national swimming championship by achieving the required qualifying time.",
    a: ["specified", "qualified", "exemplified", "disqualified"],
    c: 1
  },
  {
    q: "The young researcher managed to complete the complicated data-processing task almost ______ because she had developed an efficient computer program to automate most of the calculations.",
    a: ["effort", "effortless", "effortlessly", "effortlessness"],
    c: 2
  },
  {
    q: "The educational charity received a generous donation from an anonymous ______ who wanted to support children from disadvantaged backgrounds.",
    a: ["beneficiary", "benefactor", "applicant", "analyst"],
    c: 1
  },
  {
    q: "The young volunteer received a national award for her exemplary behaviour and outstanding dedication to community service. The word 'exemplary' is CLOSEST in meaning to ______.",
    a: ["outstanding", "potential", "unqualified", "effortless"],
    c: 0
  },
  {
    q: "The hospital is looking for qualified medical personnel who possess the necessary professional skills and experience to provide safe patient care. The word 'qualified' is OPPOSITE in meaning to ______.",
    a: ["experienced", "competent", "unqualified", "exemplary"],
    c: 2
  },
  {
    q: "The teacher asked each student to choose one particular environmental problem and explain its causes and possible solutions in detail. The word 'particular' is CLOSEST in meaning to ______.",
    a: ["personal", "specific", "potential", "beneficial"],
    c: 1
  },
  {
    q: "The lecturer used several real-life examples to illustrate how artificial intelligence can improve the efficiency of modern transportation systems. The word 'illustrate' is CLOSEST in meaning to ______.",
    a: ["specify", "analyse", "exemplify", "qualify"],
    c: 2
  },
  {
    q: "Learning how to use artificial intelligence tools can be advantageous to students because these tools help them organise information, save time and improve their research skills. The word 'advantageous' is CLOSEST in meaning to ______.",
    a: ["beneficial", "personal", "engaging", "specific"],
    c: 0
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
