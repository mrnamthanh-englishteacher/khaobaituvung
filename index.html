<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG  ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
 {
    q: "During the floods, several completely invented rescue stories spread online. Investigators later confirmed that the stories were deliberately ______ and had no basis in reality.",
    a: ["unverified", "fabricated", "curated", "coherent"],
    c: 1
  },
  {
    q: "The government launched a nationwide campaign to ______ websites that deliberately spread dangerous misinformation, imposing penalties on those responsible.",
    a: ["feed on", "rally around", "crack down on", "pave the way for"],
    c: 2
  },
  {
    q: "During the emergency, constant rumours and misleading posts began to ______ public confidence in official rescue announcements, gradually weakening people's trust.",
    a: ["chip away at", "lay the groundwork for", "prevail over", "go hand in hand with"],
    c: 0
  },
  {
    q: "The mayor's speech was completely inaudible because the protesters' loud chanting managed to ______ his voice.",
    a: ["sideline", "twist", "amplify", "drown out"],
    c: 3
  },
  {
    q: "Even after repeated setbacks, the charity refused to ______; volunteers continued their relief work until every affected family had received assistance.",
    a: ["throw in the towel", "throw it off balance", "turn a blind eye to", "take root"],
    c: 0
  },
  {
    q: "The fake advertisement promised instant wealth and displayed impressive-looking but meaningless statistics. Experts described the presentation as pure ______ intended to deceive investors.",
    a: ["public discourse", "collateral damage", "smoke and mirrors", "fact-checking"],
    c: 2
  },
  {
    q: "After several weeks of public education and coordinated action, accurate information finally began to replace false rumours, helping authorities ______ in the battle against misinformation.",
    a: ["spiral out of control", "turn the tide", "slip through their fingers", "weed out"],
    c: 1
  },
  {
    q: "Following the announcement of a revolutionary AI chip, the company's share price increased by more than 300% in just two days. Its value appeared to ______ overnight.",
    a: ["tumble", "materialize", "skyrocket", "outpace"],
    c: 2
  },
  {
    q: "Although the startup initially attracted huge investment, it soon struggled to pay its employees and operating expenses. Without emergency funding, it would be unable to ______.",
    a: ["keep afloat", "double down on", "lock horns over", "kick into high gear"],
    c: 0
  },
  {
    q: "After spending billions on experimental AI systems without producing any commercially successful products, investors began questioning the project's long-term ______.",
    a: ["rivalry", "valuation", "projection", "profitability"],
    c: 3
  },
  {
    q: "Although competitors had already abandoned similar projects, the researchers refused to ______ and continued working until they achieved a breakthrough.",
    a: ["run out of steam", "throw in the towel", "pick up the pieces", "strike a delicate balance"],
    c: 1
  },
  {
    q: "The two technology giants have repeatedly ______ control of the global semiconductor market, with each trying to secure exclusive supply agreements.",
    a: ["locked horns over", "rallied around", "laid the groundwork for", "remained confined to"],
    c: 0
  },
  {
    q: "The company invested heavily in advanced laboratories and researcher training, hoping that these efforts would ______ future scientific breakthroughs.",
    a: ["downplay", "exacerbate", "facilitate", "overlook"],
    c: 2
  },
  {
    q: "Despite analysts' optimistic forecasts, the expected technological revolution failed to ______ because the necessary infrastructure was never completed.",
    a: ["resonate with", "materialize", "cultivate", "reinforce"],
    c: 1
  },
  {
    q: "When designing a mobile application, developers must consider several technical ______, including limited screen size, battery capacity, and processing power.",
    a: ["innovations", "advantages", "adjustments", "constraints"],
    c: 3
  },
  {
    q: "The shopping app displayed dozens of advertisements, animated banners, and overlapping buttons on a single screen. This excessive ______ made it difficult for users to find the checkout button.",
    a: ["visual hierarchy", "visual clutter", "navigation", "responsiveness"],
    c: 1
  },
  {
    q: "The website was redesigned with larger buttons and simpler menus so that elderly users could ______ through its different sections more easily.",
    a: ["interpret", "evaluate", "navigate", "retrieve"],
    c: 2
  },
  {
    q: "The team removed several ______ features that duplicated existing functions and added no practical value to the application.",
    a: ["redundant", "essential", "compact", "touch-based"],
    c: 0
  },
  {
    q: "To reduce the amount of storage required by thousands of high-resolution photographs, the developers introduced a new image ______ technique.",
    a: ["optimisation", "compression", "adjustment", "innovation"],
    c: 1
  },
  {
    q: "The engineer tested the prototype repeatedly, identified minor design flaws, and made small improvements to ______ its performance before the final release.",
    a: ["accommodate", "sideline", "replace", "refine"],
    c: 3
  },
  {
    q: "The application automatically rearranges its menus and images to fit phones, tablets, and desktop screens. This is an example of ______.",
    a: ["selective exposure", "gesture-based interaction", "adaptive design", "cognitive effort"],
    c: 2
  },
  {
    q: "A user follows only news sources that support her political opinions and immediately dismisses evidence that challenges them. This behaviour illustrates ______.",
    a: ["confirmation bias", "digital literacy", "open-mindedness", "credibility"],
    c: 0
  },
  {
    q: "The social media platform repeatedly recommends content that agrees with users' existing beliefs, creating an ______ in which they rarely encounter opposing views.",
    a: ["interface", "echo chamber", "obstacle", "newsroom"],
    c: 1
  },
  {
    q: "The algorithm continuously recommends similar content based on users' previous clicks. Those recommendations then influence future clicks, creating a self-reinforcing ______.",
    a: ["gold rush", "visual hierarchy", "feedback loop", "public discourse"],
    c: 2
  },
  {
    q: "Instead of presenting the full extent of the environmental disaster, the company's spokesperson tried to ______ its seriousness, describing the widespread contamination as a minor inconvenience.",
    a: ["verify", "amplify", "exacerbate", "downplay"],
    c: 3
  },
  {
    q: "The two scientific teams reached very different conclusions because they relied on completely ______ datasets collected using incompatible methods.",
    a: ["comprehensive", "disparate", "credible", "first-hand"],
    c: 1
  },
  {
    q: "The educational campaign encourages young people to examine multiple viewpoints and question their own assumptions rather than accept information blindly. Its main goal is to ______ critical thinking.",
    a: ["impede", "contradict", "foster", "sideline"],
    c: 2
  },
  {
    q: "The fake news story intensified existing hostility between the two communities, making an already serious conflict much worse. It clearly served to ______ social divisions.",
    a: ["exacerbate", "cultivate", "compensate for", "eliminate"],
    c: 0
  },
  {
    q: "The newspaper received an extraordinary volume of reader submissions—more than one million in a single day, far exceeding anything in its previous 100-year history. Editors described this response as ______.",
    a: ["excessive", "subtle", "unprecedented", "relentless"],
    c: 2
  },
  {
    q: "Rather than creating an entirely separate system, the newspaper decided to ______ AI tools into its existing editorial workflow.",
    a: ["integrate", "reject", "separate", "replace"],
    c: 0
  },
  {
    q: "To verify the politician's statement, the journalist needed to ______ official financial records from the government's online database.",
    a: ["circulate", "cultivate", "weaponise", "retrieve"],
    c: 3
  },
  {
    q: "Although the article contained many technical details, its arguments were logically connected and easy to follow. The editor praised it as a highly ______ piece of writing.",
    a: ["sensational", "coherent", "fragmented", "inflated"],
    c: 1
  },
  {
    q: "The reporter spent six months examining confidential documents, interviewing whistleblowers, and uncovering evidence of corruption that officials had tried to conceal. This is a classic example of ______.",
    a: ["investigative journalism", "content distribution", "algorithmic tailoring", "image compression"],
    c: 0
  },
  {
    q: "Even with advanced AI systems, experienced human editors remain ______ when decisions require ethical judgment, careful source verification, and an understanding of complex social contexts.",
    a: ["elusive", "dubious", "catastrophic", "indispensable"],
    c: 3
  },
  {
    q: "The news website looked impressive, with beautiful graphics and smooth animations. However, its articles contained numerous factual errors. Attractive presentation cannot ______ inaccurate reporting.",
    a: ["take root", "compensate for", "prevail over", "tip the scales"],
    c: 1
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
