<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG UNIT 3 ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
  {
    q: 'What does "decompose" mean?',
    a: ["Tái sử dụng", "Phân hủy", "Đóng gói", "Bảo quản"],
    c: 1
  },
  {
    q: 'What does "packaging" mean?',
    a: ["Hàng tồn kho", "Chất thải", "Bao bì, vật liệu đóng gói", "Sản phẩm"],
    c: 2
  },
  {
    q: 'What does "discard" mean?',
    a: ["Vứt bỏ", "Thu gom", "Chấp nhận", "Lưu trữ"],
    c: 0
  },
  {
    q: 'What does "storage" mean?',
    a: ["Sự phân hủy", "Sự ô nhiễm", "Sự chấp nhận", "Sự lưu trữ, bảo quản"],
    c: 3
  },
  {
    q: 'What does "a substantial portion of" mean?',
    a: ["Một phần rất nhỏ của", "Một phần đáng kể của", "Toàn bộ", "Không có phần nào"],
    c: 1
  },
  {
    q: 'What does "leftover" mean?',
    a: ["Được tái chế", "Bị hỏng", "Còn thừa, còn lại", "Đã được rửa sạch"],
    c: 2
  },
  {
    q: 'What does "acceptable" mean?',
    a: ["Có thể chấp nhận được", "Không thể chấp nhận được", "Không chính xác", "Nguy hiểm"],
    c: 0
  },
  {
    q: 'What does "by mistake" mean?',
    a: ["Một cách cẩn thận", "Có chủ ý", "Theo kế hoạch", "Do nhầm lẫn"],
    c: 3
  },
  {
    q: 'What does "contaminant" mean?',
    a: ["Chất bảo quản", "Chất gây ô nhiễm", "Bao bì", "Chất dinh dưỡng"],
    c: 1
  },
  {
    q: 'What does "rinse" mean?',
    a: ["Đóng gói", "Phân hủy", "Rửa, tráng bằng nước", "Vứt bỏ"],
    c: 2
  },
  {
    q: 'Từ nào có nghĩa là "sự phân hủy"?',
    a: ["Composition", "Contamination", "Decomposition", "Proportion"],
    c: 2
  },
  {
    q: '"Một gói/bó gồm..." trong tiếng Anh là:',
    a: ["A pack of", "A portion to", "A storage of", "A mistake for"],
    c: 0
  },
  {
    q: 'Cụm từ nào có nghĩa là "vứt bỏ"?',
    a: ["Look after", "Take part in", "Put up with", "Get rid of"],
    c: 3
  },
  {
    q: '"Được lưu trữ, đang được cất giữ" trong tiếng Anh là:',
    a: ["By mistake", "In storage", "In proportion", "By accident"],
    c: 1
  },
  {
    q: 'Từ nào có nghĩa là "tỷ lệ"?',
    a: ["Portion", "Package", "Proportion", "Acceptance"],
    c: 2
  },
  {
    q: 'Từ nào có nghĩa là "tỷ lệ thuận"?',
    a: ["Directly proportional", "Inversely proportional", "Unacceptable", "Mistakenly"],
    c: 0
  },
  {
    q: 'Từ nào có nghĩa là "sự chấp nhận"?',
    a: ["Acceptable", "Accepted", "Accept", "Acceptance"],
    c: 3
  },
  {
    q: 'Cụm từ nào có nghĩa là "nhầm A với B"?',
    a: ["Accept A for B", "Mistake A for B", "Store A for B", "Rinse A with B"],
    c: 1
  },
  {
    q: 'Từ nào có nghĩa là "sự nhiễm bẩn, ô nhiễm"?',
    a: ["Contamination", "Contaminant", "Contaminate", "Composition"],
    c: 0
  },
  {
    q: 'Cụm động từ nào có nghĩa là "súc/rửa sạch bên trong"?',
    a: ["Throw away", "Break down", "Rinse out", "Pack up"],
    c: 2
  },
  {
    q: "Fruit and vegetables naturally ______ over time.",
    a: ["accept", "rinse", "pack", "decompose"],
    c: 3
  },
  {
    q: "This table is ______ wood and metal.",
    a: ["composed of", "discarded of", "accepted of", "rinsed of"],
    c: 0
  },
  {
    q: "Please don't ______ plastic bottles into the river.",
    a: ["store", "throw away", "accept", "rinse"],
    c: 1
  },
  {
    q: "We need a large ______ to carry all these books.",
    a: ["mistake", "proportion", "package", "contaminant"],
    c: 2
  },
  {
    q: "There is some ______ food in the fridge from yesterday's dinner.",
    a: ["acceptable", "proportional", "mistaken", "leftover"],
    c: 3
  },
  {
    q: "His answer is completely wrong. It is ______.",
    a: ["acceptable", "unacceptable", "acceptance", "accept"],
    c: 1
  },
  {
    q: "I took your bag ______ because it looked like mine.",
    a: ["by mistake", "in storage", "on purpose", "in proportion"],
    c: 0
  },
  {
    q: "Dirty water can ______ food and make people sick.",
    a: ["decompose", "accept", "contaminate", "proportion"],
    c: 2
  },
  {
    q: "Please ______ the vegetables with clean water before cooking.",
    a: ["discard", "rinse", "store", "pack"],
    c: 1
  },
  {
    q: "The amount of money you earn is directly ______ to the number of hours you work.",
    a: ["proportion", "proportionate of", "proportioning", "proportional"],
    c: 3
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
