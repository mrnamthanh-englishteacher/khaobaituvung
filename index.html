<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG  ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></div> 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
{
    question: "Climate change is a global ______ that affects people in almost every country.",
    options: ["attachment", "phenomenon", "accomplishment", "preference"],
    answer: 1
  },
  {
    question: "Winning the national English competition was a great ______ for the young student.",
    options: ["dependency", "withdrawal", "vulnerability", "accomplishment"],
    answer: 3
  },
  {
    question: "Using your phone late at night can ______ your sleep and make you feel tired the next morning.",
    options: ["interfere with", "excel at", "align with", "engage with"],
    answer: 0
  },
  {
    question: "Good ______ help employees communicate effectively and build positive relationships with their colleagues.",
    options: ["digital habits", "personal beliefs", "interpersonal skills", "social withdrawal"],
    answer: 2
  },
  {
    question: "The company's new environmental policy should ______ its commitment to protecting nature.",
    options: ["interfere with", "align with", "break down", "run down"],
    answer: 1
  },
  {
    question: "Some people try to ______ others by giving them excessive compliments to gain their support.",
    options: ["flatter", "monitor", "preserve", "verify"],
    answer: 0
  },
  {
    question: "Driving at high speed in heavy rain can ______ to both drivers and pedestrians.",
    options: ["take responsibility", "make an effort", "gain proficiency", "pose a risk"],
    answer: 3
  },
  {
    question: "The teacher was very ______ and understood how difficult the situation was for her students.",
    options: ["excessive", "intricate", "empathetic", "ambiguous"],
    answer: 2
  },
  {
    question: "The school decided to ______ its teaching methods to meet the individual needs of students.",
    options: ["tailor", "dominate", "mimic", "hinder"],
    answer: 0
  },
  {
    question: "Young children often ______ the sounds and actions of their parents as a way of learning.",
    options: ["curtail", "delegate", "reinforce", "mimic"],
    answer: 3
  },
  {
    question: "The growing ______ on smartphones has made it difficult for some people to remember information independently.",
    options: ["autonomy", "dependency", "integrity", "authenticity"],
    answer: 1
  },
  {
    question: "Students should be given more ______ so that they can make their own decisions about how to learn.",
    options: ["manipulation", "vulnerability", "autonomy", "perception"],
    answer: 2
  },
  {
    question: "The campaign aims to raise public ______ of the dangers of plastic pollution.",
    options: ["awareness", "retention", "proficiency", "consolidation"],
    answer: 0
  },
  {
    question: "The manager decided to ______ some of her duties to other team members because she was too busy.",
    options: ["encounter", "alter", "preserve", "delegate"],
    answer: 3
  },
  {
    question: "Our car suddenly stopped working on the way to school. It had ______.",
    options: ["taken over", "broken down", "aligned with", "excelled at"],
    answer: 1
  },
  {
    question: "The government has introduced new measures to ______ the country's historical buildings for future generations.",
    options: ["diminish", "bypass", "preserve", "dominate"],
    answer: 2
  },
  {
    question: "People who do not get enough sleep are more ______ making mistakes at work.",
    options: ["devoid of", "associated with", "responsible for", "prone to"],
    answer: 3
  },
  {
    question: "Advertising can influence consumers' ______ of a product, making it appear more attractive than it really is.",
    options: ["perception", "autonomy", "proficiency", "retention"],
    answer: 0
  },
  {
    question: "The success or failure of the project will depend on its final ______.",
    options: ["jurisdiction", "discourse", "outcome", "curation"],
    answer: 2
  },
  {
    question: "The hospital uses highly ______ medical equipment that can detect diseases at an early stage.",
    options: ["moderate", "sophisticated", "genuine", "universal"],
    answer: 1
  },
  {
    question: "Regular revision helps ______ what students have already learned in class.",
    options: ["curtail", "hinder", "diminish", "reinforce"],
    answer: 3
  },
  {
    question: "A good journalist should report facts objectively and avoid personal ______.",
    options: ["bias", "autonomy", "proficiency", "cohesion"],
    answer: 0
  },
  {
    question: "Social media sometimes makes it difficult to ______ reliable information ______ false information.",
    options: ["associate - with", "depend - on", "distinguish - from", "interfere - with"],
    answer: 2
  },
  {
    question: "Only ______ students attended the extra class because most of them were on holiday.",
    options: ["an excessive number of", "a handful of", "a vast number of", "a large number of"],
    answer: 1
  },
  {
    question: "Although she failed several times, she continued to ______ success and never gave up.",
    options: ["strive for", "interfere with", "be devoid of", "break down"],
    answer: 0
  },
  {
    question: "Doctors warn that ______ consumption of sugary drinks can lead to serious health problems.",
    options: ["moderate", "genuine", "ambiguous", "excessive"],
    answer: 3
  },
  {
    question: "Many young readers can ______ the main character because they have experienced similar problems in their own lives.",
    options: ["run down", "take over", "relate to", "pose a risk to"],
    answer: 2
  },
  {
    question: "Before sharing a news story online, you should ______ the information to make sure it is accurate.",
    options: ["mimic", "verify", "flatter", "dominate"],
    answer: 1
  },
  {
    question: "The instructions were ______, so students were unsure about what they were supposed to do.",
    options: ["ambiguous", "distinct", "genuine", "meticulous"],
    answer: 0
  },
  {
    question: "The company promotes ______ by making its financial reports available to the public.",
    options: ["dependency", "manipulation", "vulnerability", "transparency"],
    answer: 3
  }
]
;


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.options.map((t,i)=>({t,correct:i===q.answer}));
  opts = shuffle(opts);
  return {
    q:q.question,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
