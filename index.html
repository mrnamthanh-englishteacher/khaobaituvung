<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG READING UNIT 3 ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
{
    q: "The country's new energy strategy is designed to _______ its international commitments to reduce greenhouse gas emissions.",
    a: ["account for", "comply with", "align with", "stop short of"],
    c: 2
  },
  {
    q: "Additional funding was provided to _______ of renewable-energy projects that had fallen behind schedule.",
    a: ["accelerate implementation", "suspend operations", "gain traction", "alleviate pressure"],
    c: 0
  },
  {
    q: "Heavy reliance on a single overseas supplier increases a country's _______ sudden disruptions in the global energy market.",
    a: ["resilience to", "compliance with", "opposition to", "exposure to"],
    c: 3
  },
  {
    q: "Because future oil prices are highly _______, companies cannot accurately predict their transportation costs for the next five years.",
    a: ["habitable", "unpredictable", "rigorous", "indispensable"],
    c: 1
  },
  {
    q: "Expanding solar, wind, and hydropower can strengthen national _______ by reducing reliance on imported fossil fuels.",
    a: ["energy security", "vulnerability", "overconsumption", "opposition"],
    c: 0
  },
  {
    q: "The new filters are expected to _______ the amount of harmful air pollution released by the factory.",
    a: ["deploy", "fragment", "abate", "overhaul"],
    c: 2
  },
  {
    q: "Manufacturers seeking to reduce their total carbon footprint must examine every stage of their _______, from obtaining raw materials to delivering finished products.",
    a: ["regulatory framework", "value chain", "final resort", "nationwide rollout"],
    c: 1
  },
  {
    q: "The laboratory uses _______ testing procedures to ensure that its results are accurate, consistent, and independently verifiable.",
    a: ["idealistic", "volatile", "synthetic", "rigorous"],
    c: 3
  },
  {
    q: "Environmental groups criticized the regulations as too _______ because companies could exceed pollution limits without receiving meaningful penalties.",
    a: ["lax", "robust", "catastrophic", "viable"],
    c: 0
  },
  {
    q: "Rather than simply purchasing carbon credits, companies should accept _______ for reducing the environmental damage caused by their own activities.",
    a: ["massive investment", "genuine responsibility", "external fluctuations", "legal opposition"],
    c: 1
  },
  {
    q: "The sudden disappearance of an entire glacier within a few decades represents an _______ environmental change in the region's recorded history.",
    a: ["persistent", "illustrious", "habitable", "unprecedented"],
    c: 3
  },
  {
    q: "Transforming the national electricity grid to accommodate large amounts of renewable energy will require _______ in infrastructure and technology.",
    a: ["promising initiatives", "equivalent amounts", "massive investment", "final resorts"],
    c: 2
  },
  {
    q: "Responsible _______ of forests involves protecting them and managing their resources carefully for future generations.",
    a: ["feasibility", "stewardship", "vulnerability", "self-reliance"],
    c: 1
  },
  {
    q: "Severe water shortages and extreme temperatures could eventually make some regions less _______ for human populations.",
    a: ["habitable", "rigorous", "volatile", "idealistic"],
    c: 0
  },
  {
    q: "Many synthetic chemicals are highly _______ in the environment, remaining in soil and water for decades after their release.",
    a: ["unpredictable", "viable", "persistent", "renewable"],
    c: 2
  },
  {
    q: "Chemical pollution from factories can _______ by damaging aquatic food chains and reducing populations of native species.",
    a: ["foster biodiversity", "comply with regulations", "alleviate pressure on rivers", "disrupt ecosystems"],
    c: 3
  },
  {
    q: "Policymakers must _______ of plastic pollution rather than merely dealing with its visible effects.",
    a: ["address the challenge", "gain traction", "suspend operations", "distinguish the challenge"],
    c: 0
  },
  {
    q: "A clear _______ is needed to define environmental standards, enforcement procedures, and the responsibilities of different government agencies.",
    a: ["circular economy", "regulatory framework", "core operation", "collective effort"],
    c: 1
  },
  {
    q: "Factories that deliberately _______ by releasing untreated wastewater into rivers may face heavy fines or closure.",
    a: ["foster biodiversity", "gain traction", "embrace an idea", "violate regulations"],
    c: 3
  },
  {
    q: "A prolonged shortage of fuel could have serious economic _______ for transportation, manufacturing, and food distribution.",
    a: ["appeals", "initiatives", "ramifications", "stewardships"],
    c: 2
  },
  {
    q: "Expanding reliable public transportation can _______ overcrowded roads by encouraging commuters to leave their cars at home.",
    a: ["place pressure on", "alleviate pressure on", "be rooted in", "account for"],
    c: 1
  },
  {
    q: "Clean water is _______ to human health; communities cannot function safely without a reliable supply.",
    a: ["indispensable", "reluctant", "idealistic", "volatile"],
    c: 0
  },
  {
    q: "Replanting native trees and restoring wetlands can _______ by providing habitats for a wider variety of species.",
    a: ["fragment habitats", "cut emissions", "foster biodiversity", "violate regulations"],
    c: 2
  },
  {
    q: "Small island communities face particular _______ to rising sea levels because much of their infrastructure lies close to the coast.",
    a: ["feasibility", "self-reliance", "resilience", "vulnerability"],
    c: 3
  },
  {
    q: "Improving energy efficiency is a _______ of the country's climate strategy because it supports many other emission-reduction measures.",
    a: ["final resort", "cornerstone", "legal requirement", "fluctuation"],
    c: 1
  },
  {
    q: "Replacing an entire fleet of diesel buses with electric vehicles may _______ initially, even though it can provide substantial long-term benefits.",
    a: ["gain traction", "be in place", "come at a cost", "stop short of changing"],
    c: 2
  },
  {
    q: "The rapid expansion of fast fashion has been _______ consumers' growing demand for inexpensive and frequently changing clothing.",
    a: ["exposed to", "driven by", "distinguished from", "in compliance with"],
    c: 1
  },
  {
    q: "The popularity of cheap disposable goods has contributed to _______, with consumers purchasing far more products than they actually need.",
    a: ["stewardship", "self-reliance", "feasibility", "overconsumption"],
    c: 3
  },
  {
    q: "Consumers should not simply _______ old electronic devices because many of their components can be reused or recycled.",
    a: ["discard", "foster", "deploy", "abate"],
    c: 0
  },
  {
    q: "Under suitable conditions, some forms of biodegradable packaging can _______ naturally instead of remaining in the environment for centuries.",
    a: ["decarbonize", "overhaul", "decompose", "fragment"],
    c: 2
  },
  {
    q: "Increasing domestic electricity production could help the country _______ imported coal and protect it from external fluctuations in energy prices.",
    a: ["account for", "reduce dependence on", "comply with", "distinguish from"],
    c: 1
  },
  {
    q: "Stricter efficiency standards for cars and factories are intended to _______ and help the country meet its climate targets.",
    a: ["gain traction", "embrace an idea", "suspend operations", "cut emissions"],
    c: 3
  },
  {
    q: "The plan has considerable public _______, but experts question whether it can actually be implemented with the technology currently available.",
    a: ["appeal", "opposition", "vulnerability", "compliance"],
    c: 0
  },
  {
    q: "After examining the costs and available technology, engineers concluded that the proposed recycling system was technically and economically _______.",
    a: ["persistent", "viable", "catastrophic", "lax"],
    c: 1
  },
  {
    q: "Although many politicians support the circular economy _______, some remain reluctant to introduce the legal requirements needed to make it work.",
    a: ["at the source", "on a national scale", "as a final resort", "in principle"],
    c: 3
  },
  {
    q: "The government plans to _______ a new monitoring system across all major industrial zones to detect illegal pollution more quickly.",
    a: ["offset", "decompose", "deploy", "distinguish"],
    c: 2
  },
  {
    q: "Scientists concluded that the decline in the bird population was _______ habitat loss rather than short-term changes in weather.",
    a: ["rooted in", "in compliance with", "reluctant to", "equivalent to"],
    c: 0
  },
  {
    q: "A successful recycling scheme in several cities is now being prepared for a _______ so that communities across the entire country can participate.",
    a: ["fundamental change", "nationwide rollout", "final resort", "core operation"],
    c: 1
  },
  {
    q: "Heavy industries are particularly difficult to _______ because many of their core operations still depend on fossil fuels.",
    a: ["discard", "decompose", "decarbonize", "fragment"],
    c: 2
  },
  {
    q: "Carbon offsets should be used only as a _______ for unavoidable emissions after companies have made every practical effort to eliminate emissions at the source.",
    a: ["promising initiative", "cornerstone", "collective effort", "final resort"],
    c: 3
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){clearInterval(timer);submitQuiz();}
},1000);

// submit
function submitQuiz(){
  let name=document.getElementById("username").value.trim();
  if(!name){alert("Nhập tên!");return;}
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br><br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
